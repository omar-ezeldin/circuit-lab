<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cl-mask-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0D1017" />
    </linearGradient>
    <linearGradient id="cl-mask-trace" x1="96" y1="248" x2="416" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Full-bleed opaque anodized carbon background for Android adaptive icon masking -->
  <rect x="0" y="0" width="512" height="512" fill="url(#cl-mask-bg)" />

  <!-- Centered cleanly inside inner 64% safe zone (~20% safe margin on all sides) -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <!-- Precision Corner Registration Ticks -->
    <g stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M 96 116 V 96 H 116" />
      <path d="M 396 96 H 416 V 116" />
      <path d="M 96 396 V 416 H 116" />
      <path d="M 396 416 H 416 V 396" />
    </g>

    <!-- Subtle Reference Datum / Ground Accent -->
    <g stroke="#64748B" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.78">
      <line x1="256" y1="340" x2="256" y2="366" />
      <line x1="226" y1="366" x2="286" y2="366" />
      <line x1="236" y1="382" x2="276" y2="382" />
      <line x1="246" y1="398" x2="266" y2="398" />
    </g>

    <!-- Precision IEEE 3-Peak Resistor Trace -->
    <path
      d="M 118 248 H 154 L 171 196 L 205 300 L 239 196 L 273 300 L 307 196 L 341 300 L 358 248 H 394"
      fill="none"
      stroke="url(#cl-mask-trace)"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Input & Output Precision Terminal Nodes -->
    <g>
      <circle cx="98" cy="248" r="23" fill="#0F141D" stroke="#F8FAFC" stroke-width="12" />
      <circle cx="98" cy="248" r="7" fill="#3B82F6" />

      <circle cx="414" cy="248" r="23" fill="#0F141D" stroke="#F8FAFC" stroke-width="12" />
      <circle cx="414" cy="248" r="7" fill="#3B82F6" />
    </g>
  </g>
</svg>
