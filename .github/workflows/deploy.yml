name: Deploy Circuit Lab to GitHub Pages

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run type & Svelte checks
        run: pnpm check

  build:
    runs-on: ubuntu-latest
    needs: verify
    env:
      STAGING_SLUG: ${{ secrets.STAGING_SLUG }}
    steps:
      - name: Validate STAGING_SLUG
        run: |
          if [ -n "${STAGING_SLUG}" ] && [[ ! "${STAGING_SLUG}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid STAGING_SLUG secret format. Must match ^[a-zA-Z0-9_-]+$."
            exit 1
          fi

      - name: Checkout production branch (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-prod

      - name: Check whether staging should deploy
        id: check_staging
        run: |
          if [ -n "${STAGING_SLUG}" ] && git -C src-prod ls-remote --exit-code --heads origin staging >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout staging branch
        if: steps.check_staging.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          path: src-staging

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src-prod/pnpm-lock.yaml

      - name: Build Production (main)
        id: build_prod
        run: |
          set -euo pipefail
          cd src-prod
          pnpm install --frozen-lockfile
          PROD_SHA="$(git rev-parse --short HEAD)"
          echo "sha=${PROD_SHA}" >> "$GITHUB_OUTPUT"
          BASE_PATH=/circuit-lab VITE_DEPLOY_ENV=production VITE_COMMIT_SHA="${PROD_SHA}" pnpm build
          cd ..
          rm -rf dist
          mkdir -p dist
          cp -a src-prod/build/. dist/
          touch dist/.nojekyll

      - name: Build Staging (staging)
        id: build_staging
        if: steps.check_staging.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cd src-staging
          pnpm install --frozen-lockfile
          STAGING_SHA="$(git rev-parse --short HEAD)"
          echo "sha=${STAGING_SHA}" >> "$GITHUB_OUTPUT"
          BASE_PATH="/circuit-lab/${STAGING_SLUG}" VITE_DEPLOY_ENV=staging VITE_COMMIT_SHA="${STAGING_SHA}" pnpm build
          cd ..
          mkdir -p "dist/${STAGING_SLUG}"
          cp -a src-staging/build/. "dist/${STAGING_SLUG}/"

      - name: Write deployment summary
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          PROD_SHA: ${{ steps.build_prod.outputs.sha }}
          STAGING_EXISTS: ${{ steps.check_staging.outputs.exists }}
          STAGING_SHA: ${{ steps.build_staging.outputs.sha }}
        run: |
          OWNER_LOWER="${REPO_OWNER,,}"
          BASE_URL="https://${OWNER_LOWER}.github.io/circuit-lab"
          {
            echo "### Circuit Lab Deployment Summary"
            echo ""
            echo "| Environment | Branch | Commit | URL |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| Production | \`main\` | \`${PROD_SHA}\` | ${BASE_URL}/ |"
            if [ "${STAGING_EXISTS}" = "true" ]; then
              echo "| Staging | \`staging\` | \`${STAGING_SHA}\` | _private (configured via secret)_ |"
            else
              echo "| Staging | \`staging\` | _not deployed_ | _skipped_ |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
